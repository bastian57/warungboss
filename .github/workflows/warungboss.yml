name: WarungBoss Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (manual cmdline-tools, NO setup-android (broken))
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.7 (AGP 8.5.2 butuh min Gradle 8.7)
        run: |
          set -e
          cd /tmp
          curl -sL -o gradle-8.7-bin.zip "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          unzip -q -o gradle-8.7-bin.zip
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.7/bin/gradle --version | head -n 5

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ERROR: KEYSTORE_BASE64 secret KOSONG - belum diisi di repo Settings > Secrets"; exit 1; fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r\t ')
          echo "KEYSTORE_BASE64 panjang setelah dibersihkan: ${#CLEAN} karakter"
          printf '%s' "$CLEAN" | grep -q '[^A-Za-z0-9+/=]' && { echo "ERROR: KEYSTORE_BASE64 mengandung karakter bukan-base64 (mungkin ada prefix, spasi, atau teks lain - harus murni base64 keystore)"; exit 1; } || true
          printf '%s' "$CLEAN" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -lh "$GITHUB_WORKSPACE/release.keystore"
          file "$GITHUB_WORKSPACE/release.keystore" || true

      - name: Build release APK (log ke build.log)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk WarungBoss-v1.1.0.apk
          ls -lh WarungBoss-v1.1.0.apk build.log

      - name: Upload APK + build.log ke rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "latest" --notes "Rolling latest build - WarungBoss"
          gh release upload latest WarungBoss-v1.1.0.apk --clobber
          gh release view build-log > /dev/null 2>&1 || gh release create build-log --title "build-log" --notes "Build logs - WarungBoss"
          gh release upload build-log build.log --clobber
          echo "UPLOAD OK"
